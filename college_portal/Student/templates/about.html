
<!DOCTYPE html>
<html>
<head>
    <title>About Student</title>
</head>
<body>

    <h1>Student Details</h1>

    <p>Name: {{ data.name }}</p>
    <p>Age: {{ data.age }}</p>
    <p>Department: {{ data.department }}</p>

    <h2>Marks</h2>

    {% for mark in marks %}
        <p>{{ mark }}</p>
    {% endfor %}

</body>
</html>
